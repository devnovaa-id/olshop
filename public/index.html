<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Toko Online UMKM - Modern 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Navbar Desktop -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#/"><i class="fas fa-store me-2"></i>Toko UMKM</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#/products">Produk</a></li>
          <li class="nav-item"><a class="nav-link" href="#/cart"><i class="fas fa-shopping-cart"></i> <span id="cartCount" class="badge bg-danger">0</span></a></li>
          <li class="nav-item"><a class="nav-link" href="#/track">Lacak</a></li>
          <li class="nav-item" id="navLogin"><a class="nav-link" href="#/login">Login</a></li>
          <li class="nav-item dropdown d-none" id="navUser">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
              <i class="fas fa-user-circle"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#/admin">Dashboard</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="app" class="container my-4"></main>

  <!-- Bottom Navigation (Mobile) -->
  <div class="bottom-nav">
    <div class="nav-items">
      <a href="#/" class="nav-item" data-route="/">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="#/products" class="nav-item" data-route="/products">
        <i class="fas fa-search"></i>
        <span>Produk</span>
      </a>
      <a href="#/cart" class="nav-item" data-route="/cart">
        <i class="fas fa-shopping-cart"></i>
        <span>Keranjang</span>
        <span class="badge bg-danger" id="mobileCartCount">0</span>
      </a>
      <a href="#/track" class="nav-item" data-route="/track">
        <i class="fas fa-truck"></i>
        <span>Lacak</span>
      </a>
      <a href="#/login" class="nav-item" data-route="/login" id="mobileLogin">
        <i class="fas fa-user"></i>
        <span>Login</span>
      </a>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/services/api.js"></script>
  <script src="assets/js/utils/helpers.js"></script>
  <script src="assets/js/utils/ui.js"></script>
  <script src="assets/js/utils/supabase.js" type="module"></script>
  <script src="assets/js/pages/home.js"></script>
  <script src="assets/js/pages/products.js"></script>
  <script src="assets/js/pages/product-detail.js"></script>
  <script src="assets/js/pages/cart.js"></script>
  <script src="assets/js/pages/checkout.js"></script>
  <script src="assets/js/pages/track-order.js"></script>
  <script src="assets/js/pages/login.js"></script>
  <script src="assets/js/pages/admin/dashboard.js"></script>
  <script src="assets/js/pages/admin/products.js"></script>
  <script src="assets/js/pages/admin/categories.js"></script>
  <script src="assets/js/pages/admin/orders.js"></script>
  <script src="assets/js/pages/admin/customers.js"></script>
  <script src="assets/js/pages/admin/users.js"></script>
  <script src="assets/js/pages/admin/settings.js"></script>
</body>
</html>
